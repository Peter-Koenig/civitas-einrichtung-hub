# MapProxy-Konfiguration für p2d2 — Adaption für CIVITAS/CORE-Cluster
# Quelle: p2d2-Standalone /srv/mapproxy/mapproxy.yaml (Bestandsaufnahme 2026-09-12).
# Der Namespace wird zur Laufzeit aus ADDON_NS gerendert (__P2D2_NAMESPACE__).
#
# Anpassungen gegenüber Standalone:
#  1. GeoServer-URL: Legacy-IP -> Cluster-Service-DNS
#     http://192.168.122.112:8080/geoserver/wms
#     -> http://geoserver-geoserver.__P2D2_NAMESPACE__.svc.cluster.local/geoserver/wms
#  2. styles "friedhofsplan_transparent": in beiden WMS-Quellen gesetzt (Stand
#     Standalone-Export 2026-09-29). Der Style ist nötig: Ohne ihn zeichnet der
#     GeoServer das GeoTIFF deckend, mit schwarzem Hintergrund (gemessen 2026-10-29).
#  3. Cache-Verzeichnisse: /srv/mapproxy/cache_data/... -> PVC-Mount /cache_data/...
#  4. globals.cache.base_dir auf /cache_data gesetzt (damit auch der OSM-Cache auf dem PVC liegt)
#  5. Dienst-Metadaten (wms.md/wmts.md) aus supplement/geoserver-metadata.md
#     (service-Block): organization/email/city/country, fees NONE, Lizenz CC0/ODbL.
#     keyword_list im MapProxy-Format (Liste von Objekten mit keywords).

globals:
  cache:
    base_dir: '/cache_data'
  http:
    access_control_allow_origin: ""
    # CORS: im AddOn setzt die APISIX-Route (cors-Plugin) den Header; hier leer lassen, sonst doppelt.

services:
  wms:
    md:
      title: "p2d2 Karten (MapProxy)"
      abstract: "Gecachte Karten der Anwendung p2d2 (Public-Public Data-DNA): OpenStreetMap-Hintergrund und Friedhofspläne."
      online_resource: https://www.data-dna.eu
      keyword_list:
        - keywords: ["p2d2", "Public-Public Data-DNA", "Geodaten", "Friedhöfe"]
      contact:
        organization: "p2d2 c/o Projektberatung Dr. König"
        email: info@data-dna.eu
        city: Bonn
        country: Deutschland
      access_constraints: "Friedhofspläne: CC0-1.0. Layer p2d2_osm: (c) OpenStreetMap-Mitwirkende, ODbL-1.0 (https://www.openstreetmap.org/copyright)."
      fees: 'NONE'
    strict: false
    srs: ['EPSG:25832', 'EPSG:3857', 'EPSG:4326']
  wmts:
    md:
      title: "p2d2 Karten (MapProxy)"
      abstract: "Gecachte Karten der Anwendung p2d2 (Public-Public Data-DNA): OpenStreetMap-Hintergrund und Friedhofspläne."
      online_resource: https://www.data-dna.eu
      keyword_list:
        - keywords: ["p2d2", "Public-Public Data-DNA", "Geodaten", "Friedhöfe"]
      contact:
        organization: "p2d2 c/o Projektberatung Dr. König"
        email: info@data-dna.eu
        city: Bonn
        country: Deutschland
      access_constraints: "Friedhofspläne: CC0-1.0. Layer p2d2_osm: (c) OpenStreetMap-Mitwirkende, ODbL-1.0 (https://www.openstreetmap.org/copyright)."
      fees: 'NONE'
  tms:
    use_grid_names: true

layers:
  - name: p2d2_osm
    title: OSM in EPSG:25832
    sources: [osm_cache]

  - name: p2d2_cemeteries_overview
    title: "p2d2 - Kölner Friedhöfe, Übersicht"
    sources: [cemeteries_overview_cache]

  - name: p2d2_cemeteries_details
    title: "Friedhofspläne Köln (Detailansicht)"
    sources: [cemeteries_details_cache]

caches:
  osm_cache:
    grids: [osm_grid_3857]
    meta_size: [4, 4]
    sources: [osm_source]

  cemeteries_overview_cache:
    grids: [cemeteries_overview_grid_25832]
    sources: [cemeteries_overview_wms]
    format: image/png
    request_format: image/png
    image:
      resampling_method: nearest
      paletted: false
      mode: RGBA
      transparent: true
    cache:
      type: file
      directory: /cache_data/cemeteries_overview
      directory_layout: tms

  cemeteries_details_cache:
    grids: [cemeteries_details_grid_25832]
    sources: [cemeteries_details_wms]
    format: image/png
    request_format: image/png
    image:
      resampling_method: nearest
      paletted: false
      mode: RGBA
      transparent: true
    cache:
      type: file
      directory: /cache_data/cemeteries_details
      directory_layout: tms

sources:
  osm_source:
    type: tile
    grid: osm_grid_3857
    url: https://tile.openstreetmap.org/%(z)s/%(x)s/%(y)s.png
    http:
      headers:
        User-Agent: "p2d2-MapProxy/1.0 (https://www.data-dna.eu; info@data-dna.eu)"

  cemeteries_overview_wms:
    type: wms
    req:
      url: http://geoserver-geoserver.__P2D2_NAMESPACE__.svc.cluster.local/geoserver/wms
      layers: "friedhofsplaene:friedhoefe_koeln"
      styles: "friedhofsplan_transparent"
      transparent: true
    image:
      resampling_method: nearest
      paletted: false
      mode: RGBA
      transparent: true
    supported_srs: ['EPSG:25832', 'EPSG:25833', 'EPSG:3857', 'EPSG:4326']
    coverage:
      bbox: [277000, 5580000, 510000, 5820000]
      srs: EPSG:25832
    wms_opts:
      featureinfo: true

  cemeteries_details_wms:
    type: wms
    req:
      url: http://geoserver-geoserver.__P2D2_NAMESPACE__.svc.cluster.local/geoserver/wms
      layers: "friedhofsplaene:friedhoefe_koeln"
      styles: "friedhofsplan_transparent"
      transparent: true
    image:
      resampling_method: nearest
      paletted: false
      mode: RGBA
      transparent: true
    supported_srs: ['EPSG:25832', 'EPSG:3857']
    coverage:
      bbox: [348000, 5628000, 392000, 5682000]
      srs: 'EPSG:25832'

grids:
  cemeteries_overview_grid_25832:
    srs: 'EPSG:25832'
    bbox: [277000, 5580000, 510000, 5820000]
    origin: 'nw'
    res_factor: 'sqrt2'
    min_res: 4891.96981025128
    max_res: 0.29858214173896974
    num_levels: 20

  cemeteries_details_grid_25832:
    srs: 'EPSG:25832'
    bbox: [348000, 5628000, 392000, 5682000]
    origin: 'nw'
    res:
      - 4.0        # Level 0
      - 2.0
      - 1.0
      - 0.5
      - 0.25
      - 0.125
      - 0.0625
      - 0.03125
      - 0.0203     # Level 8: ≈ GeoTIFF-Auflösung

  osm_grid_3857:
    srs: 'EPSG:3857'
    bbox: [-20037508.34, -20037508.34, 20037508.34, 20037508.34]
    origin: 'nw'
