apiVersion: v1
kind: ConfigMap
metadata:
  name: p2d2-main-config
  namespace: cc-prd-geodata-stack
data:
  DB_USER: P2D2-MAIN
  WFST_WORKSPACE: main
  PUBLIC_WFST_WORKSPACE: main
  PUBLIC_SITE_URL: https://www.udp.data-dna.eu
  # Server-seitiger WFS-T-Endpoint je Stage (mit Workspace-Pfad).
  # Beide Schreibweisen (plain + suffigiert) werden vom Code unterstützt.
  WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/main/ows
  WFST_ENDPOINT_MAIN: https://geoportal.udp.data-dna.eu/geoserver/main/ows
  WFST_USERNAME: p2d2_wfst_main
  WFST_USER_MAIN: p2d2_wfst_main
# Secret p2d2-main-secret: wird von apply_addon_secrets() aus .env.p2d2-addon befüllt.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-main
  namespace: cc-prd-geodata-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-main
  template:
    metadata:
      labels:
        app: p2d2-main
    spec:
      containers:
        - name: astro
          # Image-basierte Auslieferung (statt node:20-slim + PVC).
          # Image wird per k8s/frontend/build-main.sh auf dem k3s-Node gebaut.
          image: p2d2-frontend-main:v1s-2026-09-18
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-base-config
            - secretRef:
                name: p2d2-base-secret
            - configMapRef:
                name: p2d2-main-config
            - secretRef:
                name: p2d2-main-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-main
  namespace: cc-prd-geodata-stack
spec:
  type: ClusterIP
  selector:
    app: p2d2-main
  ports:
    - name: http
      port: 80
      targetPort: 4321
