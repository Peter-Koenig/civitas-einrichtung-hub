apiVersion: v1
kind: ConfigMap
metadata:
  name: p2d2-f-de2-config
  namespace: cc-prd-geodata-stack
data:
  DB_USER: P2D2-DE2
  WFST_WORKSPACE: de2
  PUBLIC_WFST_WORKSPACE: de2
  PUBLIC_SITE_URL: https://f-de2.udp.data-dna.eu
  # Server-seitiger WFS-T-Endpoint je Stage (mit Workspace-Pfad).
  WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/de2/ows
  WFST_ENDPOINT_DE2: https://geoportal.udp.data-dna.eu/geoserver/de2/ows
  WFST_USERNAME: p2d2_wfst_de2
  WFST_USER_DE2: p2d2_wfst_de2
# Secret p2d2-f-de2-secret: wird von apply_addon_secrets() aus .env.p2d2-addon befüllt.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-f-de2
  namespace: cc-prd-geodata-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-f-de2
  template:
    metadata:
      labels:
        app: p2d2-f-de2
    spec:
      containers:
        - name: astro
          # Image-basierte Auslieferung (statt node:20-slim + PVC).
          # Image wird per k8s/frontend/build-de2.sh auf dem k3s-Node gebaut.
          image: p2d2-frontend-de2:v1s-2026-09-18
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-base-config
            - secretRef:
                name: p2d2-base-secret
            - configMapRef:
                name: p2d2-f-de2-config
            - secretRef:
                name: p2d2-f-de2-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-f-de2
  namespace: cc-prd-geodata-stack
spec:
  type: ClusterIP
  selector:
    app: p2d2-f-de2
  ports:
    - name: http
      port: 80
      targetPort: 4321
