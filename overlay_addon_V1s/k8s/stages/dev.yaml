apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-dev
  namespace: __P2D2_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-dev
  template:
    metadata:
      labels:
        app: p2d2-dev
      annotations:
        p2d2-addon/config-hash: "__P2D2_CONFIG_HASH__"
    spec:
      containers:
        - name: astro
          image: __P2D2_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-base-config
            - secretRef:
                name: p2d2-base-secret
            - configMapRef:
                name: p2d2-dev-config
            - secretRef:
                name: p2d2-dev-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-dev
  namespace: __P2D2_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: p2d2-dev
  ports:
    - name: http
      port: 80
      targetPort: 4321
