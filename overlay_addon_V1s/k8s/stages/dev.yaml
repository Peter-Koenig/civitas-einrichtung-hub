apiVersion: v1
kind: ConfigMap
metadata:
  name: p2d2-dev-config
  namespace: cc-prd-geodata-stack
data:
  DB_USER: P2D2-DEVELOP
  WFST_WORKSPACE: dev
  PUBLIC_WFST_WORKSPACE: dev
  PUBLIC_SITE_URL: https://dev.udp.data-dna.eu
  # Server-seitiger WFS-T-Endpoint je Stage (mit Workspace-Pfad).
  WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/dev/ows
  WFST_ENDPOINT_DEVELOP: https://geoportal.udp.data-dna.eu/geoserver/dev/ows
  WFST_USERNAME: p2d2_wfst_develop
  WFST_USER_DEVELOP: p2d2_wfst_develop
---
apiVersion: v1
kind: Secret
metadata:
  name: p2d2-dev-secret
  namespace: cc-prd-geodata-stack
type: Opaque
stringData:
  # K3: Cluster-DB-Rolle P2D2-DEVELOP (Rotation durch Peter)
  DB_PASSWORD: CHANGEME
  # K1: GeoServer-WFS-T-Secret p2d2-geoserver-wfst-develop
  WFST_PASSWORD: CHANGEME
  WFST_PW_DEVELOP: CHANGEME
  # K2: zufällig generiert, bleibt
  SESSION_SECRET: CHANGEME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-dev
  namespace: cc-prd-geodata-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-dev
  template:
    metadata:
      labels:
        app: p2d2-dev
    spec:
      containers:
        - name: astro
          # Image-basierte Auslieferung (statt node:20-slim + PVC).
          # Image wird per k8s/frontend/build-dev.sh auf dem k3s-Node gebaut.
          image: p2d2-frontend-dev:v1s-2026-09-18
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-base-config
            - secretRef:
                name: p2d2-base-secret
            - configMapRef:
                name: p2d2-dev-config
            - secretRef:
                name: p2d2-dev-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-dev
  namespace: cc-prd-geodata-stack
spec:
  type: ClusterIP
  selector:
    app: p2d2-dev
  ports:
    - name: http
      port: 80
      targetPort: 4321
