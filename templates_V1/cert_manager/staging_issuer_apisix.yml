apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-apisix
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ inv_k8s.cert_manager.le_email }}
    privateKeySecretRef:
      name: letsencrypt-staging-apisix
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: apisix-gateway
            namespace: ingress-apisix
            sectionName: http
